name: Build menu (site + PDF)

# menu.txt is the single source of truth. Whenever it changes, rebuild BOTH
# the online menu (index.html) and the print catalog PDF in the cloud, and
# commit them back — so edits made from a phone (GitHub app) regenerate
# everything without needing a computer.

on:
  push:
    branches: [master]
    paths:
      - 'menu.txt'
      - 'print-source/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-menu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install segno
        run: pip install segno

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Rebuild online menu (index.html)
        run: python print-source/build_web.py

      - name: Rebuild print catalog (PDF)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: python print-source/build_print.py

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html MENU_Mikro_Pelion_NEOS_KATALOGOS.pdf print-source/menu-print.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-rebuild site + PDF from menu.txt [skip ci]"
            git push
          fi
